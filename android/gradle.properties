org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# Opt out of AGP 9 defaults until the Flutter Gradle plugin supports them
# (same lines the Flutter migrator adds; required by newer Flutter/Shorebird builds)
android.builtInKotlin=false
android.newDsl=false
